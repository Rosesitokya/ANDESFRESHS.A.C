<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Historial de Pedidos')}"></head>
<body>
  <nav th:replace="~{fragments/layout :: navbar}"></nav>
  <main class="container">
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div class="d-flex justify-content-between mb-3">
      <h2>Historial de Pedidos</h2>
      <div>
        <a class="btn btn-outline-dark me-2" th:href="@{/productos/inventario}">Ver Stock</a>
        <a class="btn btn-warning fw-bold" th:href="@{/pedidos/nuevo}">Nuevo pedido</a>
      </div>
    </div>
    <table class="table table-bordered align-middle">
      <thead class="table-dark"><tr><th>ID</th><th>Cliente</th><th>Fecha</th><th>Detalle</th><th>Total (S/)</th><th>Estado</th></tr></thead>
      <tbody>
        <tr th:each="p : ${pedidos}">
          <td th:text="${p.id}"></td>
          <td><b th:text="${p.cliente}"></b><br><small class="text-muted" th:text="${p.rucCliente}"></small></td>
          <td th:text="${#temporals.format(p.fecha,'dd/MM/yyyy')}"></td>
          <td>
            <div th:each="d : ${p.detalles}" th:text="${d.producto + ' (' + d.cantidad + ' kg)'}"></div>
            <span th:if="${#lists.isEmpty(p.detalles)}" class="text-muted">Pedido histórico</span>
          </td>
          <td class="fw-bold text-danger" th:text="${'S/ ' + #numbers.formatDecimal(p.total,1,2)}"></td>
          <td><span class="badge" th:classappend="${p.estado == 'DESPACHADO'} ? 'bg-success' : 'bg-warning text-dark'" th:text="${p.estado}"></span></td>
        </tr>
      </tbody>
    </table>
  </main>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
