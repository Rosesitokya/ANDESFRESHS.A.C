<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo producto')}"></head>
<body>
  <nav th:replace="~{fragments/layout :: navbar}"></nav>
  <main class="container" style="max-width:540px;">
    <h2>Registrar producto</h2>
    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" class="card card-body">
      <div class="mb-2"><label class="form-label">Código</label><input class="form-control" th:field="*{codigo}" placeholder="Ej. AGU009"></div>
      <div class="mb-2"><label class="form-label">Nombre</label><input class="form-control" th:field="*{nombre}" required></div>
      <div class="mb-2"><label class="form-label">Marca</label><input class="form-control" th:field="*{marca}" required></div>
      <div class="mb-2"><label class="form-label">Categoría</label><input class="form-control" th:field="*{categoria}" required></div>
      <div class="mb-2"><label class="form-label">Precio (S/)</label><input type="number" step="0.01" class="form-control" th:field="*{precio}" required></div>
      <div class="mb-3"><label class="form-label">Stock (kg)</label><input type="number" class="form-control" th:field="*{cantidad}" required></div>
      <button class="btn btn-success" type="submit">Guardar</button>
    </form>
  </main>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
