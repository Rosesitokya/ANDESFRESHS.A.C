<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Carga por lote')}"></head>
<body>
  <nav th:replace="~{fragments/layout :: navbar}"></nav>
  <main class="container">
    <h2>Carga por lote</h2>
    <form th:action="@{/productos/lote}" th:object="${lote}" method="post">
      <table class="table">
        <thead><tr><th>Nombre</th><th>Marca</th><th>Categoría</th><th>Precio</th><th>Stock</th></tr></thead>
        <tbody>
          <tr th:each="p, i : *{productos}">
            <td><input class="form-control" th:field="*{productos[__${i.index}__].nombre}"></td>
            <td><input class="form-control" th:field="*{productos[__${i.index}__].marca}"></td>
            <td><input class="form-control" th:field="*{productos[__${i.index}__].categoria}"></td>
            <td><input type="number" step="0.01" class="form-control" th:field="*{productos[__${i.index}__].precio}"></td>
            <td><input type="number" class="form-control" th:field="*{productos[__${i.index}__].cantidad}"></td>
          </tr>
        </tbody>
      </table>
      <button class="btn btn-success" type="submit">Guardar todos</button>
    </form>
  </main>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
