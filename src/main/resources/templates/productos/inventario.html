<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inventario')}"></head>
<body>
  <nav th:replace="~{fragments/layout :: navbar}"></nav>
  <main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>Control de Stock (Tiempo Real)</h2>
      <a class="btn btn-warning fw-bold" th:href="@{/pedidos/nuevo}">Nuevo Pedido</a>
    </div>
    <div class="card shadow-sm"><div class="card-body">
      <table class="table table-hover align-middle">
        <thead class="table-dark">
          <tr><th>Código</th><th>Producto</th><th>Marca</th><th>Precio (S/)</th><th>Stock Actual (Kg)</th><th>Estado</th></tr>
        </thead>
        <tbody>
          <tr th:each="p : ${productos}">
            <td><code th:text="${p.codigo}"></code></td>
            <td class="fw-bold" th:text="${p.nombre}"></td>
            <td th:text="${p.marca}"></td>
            <td th:text="${#numbers.formatDecimal(p.precio,1,2)}"></td>
            <td class="fw-bold" th:text="${p.cantidad} + ' kg'"></td>
            <td>
              <span th:if="${p.cantidad < 50}" class="badge bg-danger">CRÍTICO</span>
              <span th:unless="${p.cantidad < 50}" class="badge bg-success">Normal</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div></div>
  </main>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
