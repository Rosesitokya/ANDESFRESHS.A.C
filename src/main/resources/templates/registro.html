<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registro')}"></head>
<body class="bg-light">
  <div class="container mt-5" style="max-width:400px;">
    <div class="card shadow-sm"><div class="card-body">
      <h3 class="text-center mb-3">Crear cuenta</h3>
      <div th:if="${error}" th:text="${error}" class="alert alert-danger py-2"></div>
      <form th:action="@{/registro}" method="post">
        <div class="mb-3"><label class="form-label">Usuario</label><input name="username" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Contraseña (mín. 8)</label><input type="password" name="password" class="form-control" required></div>
        <button class="btn btn-success w-100" type="submit">Registrarme</button>
      </form>
      <p class="text-center mt-3 mb-0"><a th:href="@{/login}">Volver al ingreso</a></p>
    </div></div>
  </div>
</body>
</html>
